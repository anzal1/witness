[package]
name = "witness"
version = "0.1.0"
edition = "2021"
description = "A provenance-native caching proxy for model APIs: signed identities, hash-chained journal, content-addressed cache, deterministic replay, Merkle commitments."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "io-util", "io-std", "process"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
blake3 = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"

[profile.release]
lto = true
codegen-units = 1
