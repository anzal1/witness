<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wit-chain-title wit-chain-desc">
      <title id="wit-chain-title">Tamper propagation in the hash-chained journal</title>
      <desc id="wit-chain-desc">Each journal record commits to the hash of the record before it, so editing the second record invalidates its own hash and every record after it, while the published Merkle root over all record hashes lets an outsider check a single record without seeing the rest of the run.</desc>
      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5B6570"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E8552D"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E5AA8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf8f5"/>

      <!-- arrows: prev-hash links along the chain -->
      <line x1="264" y1="128" x2="336" y2="128" stroke="#5B6570" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="276" y="100" width="48" height="12" rx="2" fill="#faf8f5"/>
      <text x="300" y="109" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PREV H1</text>

      <line x1="544" y1="128" x2="616" y2="128" stroke="#E8552D" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="556" y="100" width="48" height="12" rx="2" fill="#faf8f5"/>
      <text x="580" y="109" fill="#E8552D" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PREV H2</text>

      <!-- arrows: record hashes into the Merkle root -->
      <!-- single-stroke bus: record 1 down, across, up into record 3 (no overlapping strokes) -->
      <path d="M 176,176 V 236 Q 176,244 184,244 H 712 Q 720,244 720,236 V 176" fill="none" stroke="#5B6570" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- record 2 joins the bus -->
      <line x1="440" y1="176" x2="440" y2="244" stroke="#5B6570" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- bus drops into the committed root -->
      <line x1="500" y1="244" x2="500" y2="288" stroke="#5B6570" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- nodes: three journal records -->
      <rect x="88" y="96" width="176" height="80" rx="6" fill="#faf8f5"/>
      <rect x="88" y="96" width="176" height="80" rx="6" fill="#15181c" fill-opacity="0.05" stroke="#5B6570" stroke-width="1"/>
      <rect x="96" y="104" width="48" height="12" rx="2" fill="none" stroke="#5b6570" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="120" y="112" fill="#5b6570" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEQ 1</text>
      <text x="176" y="136" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record</text>
      <text x="176" y="152" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prev = 000…0</text>
      <text x="176" y="164" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hash = H1 ✓</text>

      <rect x="352" y="96" width="176" height="80" rx="6" fill="#faf8f5"/>
      <rect x="352" y="96" width="176" height="80" rx="6" fill="#e8552d" fill-opacity="0.08" stroke="#E8552D" stroke-width="1"/>
      <rect x="360" y="104" width="48" height="12" rx="2" fill="none" stroke="#e8552d" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="384" y="112" fill="#E8552D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEQ 2</text>
      <text x="440" y="136" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record — edited</text>
      <text x="440" y="152" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prev = H1</text>
      <text x="440" y="164" fill="#E8552D" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hash ≠ H2 ✗</text>

      <rect x="632" y="96" width="176" height="80" rx="6" fill="#faf8f5"/>
      <rect x="632" y="96" width="176" height="80" rx="6" fill="#15181c" fill-opacity="0.05" stroke="#5B6570" stroke-width="1"/>
      <rect x="640" y="104" width="48" height="12" rx="2" fill="none" stroke="#5b6570" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="664" y="112" fill="#5b6570" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEQ 3</text>
      <text x="720" y="136" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record</text>
      <text x="720" y="152" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prev = stale H2</text>
      <text x="720" y="164" fill="#E8552D" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chain broken ✗</text>

      <!-- node: merkle root -->
      <rect x="404" y="288" width="192" height="64" rx="6" fill="#faf8f5"/>
      <rect x="404" y="288" width="192" height="64" rx="6" fill="#ffffff" stroke="#15181C" stroke-width="1"/>
      <rect x="412" y="296" width="40" height="12" rx="2" fill="none" stroke="#15181c" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="432" y="304" fill="#15181c" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROOF</text>
      <text x="500" y="324" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Published Merkle root</text>
      <text x="500" y="340" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">c80c54be…69d8bb</text>

      <!-- legend -->
      <line x1="32" y1="396" x2="968" y2="396" stroke="#15181c" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="32" y="416" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="408" width="12" height="12" rx="2" fill="#e8552d" fill-opacity="0.08" stroke="#E8552D" stroke-width="1"/>
      <text x="160" y="416" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INVALID AFTER EDIT</text>
      <rect x="404" y="408" width="12" height="12" rx="2" fill="#15181c" fill-opacity="0.05" stroke="#5B6570" stroke-width="1"/>
      <text x="424" y="416" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">JOURNAL RECORD</text>
      <line x1="668" y1="414" x2="700" y2="414" stroke="#5B6570" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="708" y="416" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HASH INTO ROOT</text>
    </svg>
