<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wit-arch-title wit-arch-desc">
      <title id="wit-arch-title">Witness in the request path</title>
      <desc id="wit-arch-desc">A signed agent fleet sends model calls to the witness proxy, which verifies identity, stores request and response bodies in a content-addressed store, appends a hash-chained journal record that is later committed to a Merkle root, and forwards to the upstream model API only on a cache miss.</desc>
