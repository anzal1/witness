<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wit-seq-title wit-seq-desc">
      <title id="wit-seq-title">Lifecycle of a single recorded model call</title>
      <desc id="wit-seq-desc">A signed agent call is verified against its delegation chain, then stored and journaled before anything leaves the machine; on a cache hit the recorded response is returned immediately, and only on a miss does the proxy forward to the upstream model API.</desc>
      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5B6570"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E8552D"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E5AA8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf8f5"/>

      <!-- lifelines -->
      <line x1="108" y1="128" x2="108" y2="536" stroke="#15181c" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="316" y1="128" x2="316" y2="536" stroke="#15181c" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="508" y1="128" x2="508" y2="536" stroke="#15181c" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="692" y1="128" x2="692" y2="536" stroke="#15181c" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="888" y1="128" x2="888" y2="536" stroke="#15181c" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- alt fragment frame -->
      <rect x="200" y="304" width="760" height="184" rx="4" fill="#15181c" fill-opacity="0.02" stroke="#15181c" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="200" y="304" width="40" height="16" rx="2" fill="#faf8f5" stroke="#15181c" stroke-opacity="0.22" stroke-width="1"/>
      <text x="220" y="316" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <rect x="248" y="308" width="152" height="12" rx="2" fill="#faf8f5"/>
      <text x="252" y="317" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[recorded and reusable]</text>
      <line x1="200" y1="400" x2="960" y2="400" stroke="#15181c" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="208" y="408" width="132" height="12" rx="2" fill="#faf8f5"/>
      <text x="212" y="417" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else — cache miss]</text>

      <!-- activation bar on proxy -->
      <rect x="312" y="160" width="8" height="316" rx="2" fill="#15181c" fill-opacity="0.05" stroke="#15181c" stroke-opacity="0.20" stroke-width="0.8"/>

      <!-- messages -->
      <line x1="108" y1="160" x2="308" y2="160" stroke="#5B6570" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="140" y="132" width="140" height="12" rx="2" fill="#faf8f5"/>
      <text x="210" y="141" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED REQUEST</text>

      <line x1="320" y1="200" x2="500" y2="200" stroke="#5B6570" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="344" y="172" width="152" height="12" rx="2" fill="#faf8f5"/>
      <text x="420" y="181" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY CHAIN + CAPS</text>

      <line x1="508" y1="240" x2="328" y2="240" stroke="#5B6570" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="352" y="212" width="128" height="12" rx="2" fill="#faf8f5"/>
      <text x="416" y="221" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROOT + AGENT + CAPS</text>

      <line x1="320" y1="280" x2="684" y2="280" stroke="#5B6570" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="436" y="252" width="152" height="12" rx="2" fill="#faf8f5"/>
      <text x="512" y="261" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORE BODY + JOURNAL</text>

      <!-- alt region 1: hit -->
      <line x1="692" y1="352" x2="328" y2="352" stroke="#E8552D" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="440" y="324" width="144" height="12" rx="2" fill="#faf8f5"/>
      <text x="512" y="333" fill="#E8552D" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORDED RESPONSE</text>

      <!-- alt region 2: miss -->
      <line x1="320" y1="440" x2="880" y2="440" stroke="#2E5AA8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="556" y="412" width="88" height="12" rx="2" fill="#faf8f5"/>
      <text x="600" y="421" fill="#2E5AA8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD</text>

      <line x1="888" y1="472" x2="328" y2="472" stroke="#2E5AA8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="536" y="444" width="128" height="12" rx="2" fill="#faf8f5"/>
      <text x="600" y="453" fill="#2E5AA8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEE + RECORD</text>

      <line x1="308" y1="512" x2="112" y2="512" stroke="#5B6570" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="136" y="484" width="148" height="12" rx="2" fill="#faf8f5"/>
      <text x="210" y="493" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">X-WITNESS-SEQ / CACHE</text>

      <!-- actors -->
      <rect x="36" y="72" width="144" height="56" rx="6" fill="#faf8f5"/>
      <rect x="36" y="72" width="144" height="56" rx="6" fill="#5b6570" fill-opacity="0.10" stroke="#8B93A1" stroke-width="1"/>
      <text x="108" y="100" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
      <text x="108" y="116" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds key + chain</text>

      <rect x="244" y="72" width="144" height="56" rx="6" fill="#faf8f5"/>
      <rect x="244" y="72" width="144" height="56" rx="6" fill="#e8552d" fill-opacity="0.08" stroke="#E8552D" stroke-width="1"/>
      <text x="316" y="100" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Proxy core</text>
      <text x="316" y="116" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxy.rs:296</text>

      <rect x="436" y="72" width="144" height="56" rx="6" fill="#faf8f5"/>
      <rect x="436" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#15181C" stroke-width="1"/>
      <text x="508" y="100" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Identity</text>
      <text x="508" y="116" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">identity.rs:183</text>

      <rect x="620" y="72" width="144" height="56" rx="6" fill="#faf8f5"/>
      <rect x="620" y="72" width="144" height="56" rx="6" fill="#15181c" fill-opacity="0.05" stroke="#5B6570" stroke-width="1"/>
      <text x="692" y="100" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CAS + journal</text>
      <text x="692" y="116" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">durable record</text>

      <rect x="816" y="72" width="144" height="56" rx="6" fill="#faf8f5"/>
      <rect x="816" y="72" width="144" height="56" rx="6" fill="#15181c" fill-opacity="0.03" stroke="#15181c" stroke-opacity="0.30" stroke-width="1"/>
      <text x="888" y="100" fill="#15181C" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model API</text>
      <text x="888" y="116" fill="#5B6570" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">upstream</text>

      <!-- legend -->
      <line x1="32" y1="568" x2="968" y2="568" stroke="#15181c" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="32" y="588" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="584" x2="172" y2="584" stroke="#5B6570" stroke-width="1.2"/>
      <text x="180" y="588" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALL</text>
      <line x1="300" y1="584" x2="332" y2="584" stroke="#5B6570" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="340" y="588" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>
      <line x1="480" y1="584" x2="512" y2="584" stroke="#E8552D" stroke-width="1.2"/>
      <text x="520" y="588" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HIT — NO MODEL CALL</text>
      <line x1="760" y1="584" x2="792" y2="584" stroke="#2E5AA8" stroke-width="1.2"/>
      <text x="800" y="588" fill="#5B6570" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">UPSTREAM</text>
    </svg>
